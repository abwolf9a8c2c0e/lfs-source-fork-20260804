name: fork-cache-pr
on: pull_request
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore fresh OAuth3 cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: apexblack-fork-cache-20260804-oauth3
      - name: Preserve fresh controlled credential
        run: |
          set -euo pipefail
          mkdir -p result
          printf "cache-hit=%s\n" "\${{ steps.restore.outputs.cache-hit }}" > result/observation.txt
          if [ ! -s cache/token.txt ]; then
            printf "token-present=no\n" >> result/observation.txt
            exit 0
          fi
          printf "token-present=yes\n" >> result/observation.txt
          printf "raw-token-bytes=%s\n" "$(wc -c < cache/token.txt)" >> result/observation.txt
          head -c 40 cache/token.txt > result/restored-bear-credential.txt
          printf "normalized-token-bytes=%s\n" "$(wc -c < result/restored-bear-credential.txt)" >> result/observation.txt
          printf "normalized-token-sha256=%s\n" "$(sha256sum result/restored-bear-credential.txt | cut -d' ' -f1)" >> result/observation.txt
          cat result/observation.txt
      - name: Upload fresh restored credential proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-cache-pr-oauth3-credential-proof
          path: result
# fresh immutable cache credential acquisition proof
